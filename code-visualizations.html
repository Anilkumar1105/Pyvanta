<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon"
href="./favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="maintenance.js"></script>
  <title>Code Visualizations Lab - Pyvanta Learning Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="code-visualizations.css" rel="stylesheet" />

  <link href="pyvanta-theme.css" rel="stylesheet" />
</head>
<body class="learning-body">
  <nav class="navbar navbar-dark bg-brand mb-4">
    <div class="container-fluid">
      <a href="student-dashboard.html" class="navbar-brand"><i class="bi bi-arrow-left me-2"></i>Back to Dashboard</a>
      <button class="btn btn-outline-light btn-sm" data-logout="true"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>
  <main class="container pb-5">
    <div id="visualizationsRoot"><div class="text-muted py-4">Loading Code Visualizations Lab…</div></div>
  </main>
  <script type="module">
    import { requireRole, wireLogoutButtons } from "./auth.js";
    import { renderCodeVisualizations } from "./code-visualizations.js";
    import { getActiveSubscription, subscriptionCanAccessVisualizations } from "./subscription-access.js";
    wireLogoutButtons();
    requireRole("student", async (user) => {
      const root = document.getElementById("visualizationsRoot");
      const subscription = await getActiveSubscription(user.uid).catch(() => null);
      if (!subscriptionCanAccessVisualizations(subscription)) {
        root.innerHTML = `
          <section class="pv-panel p-4 p-lg-5 text-center mx-auto" style="max-width:760px">
            <div class="display-5 mb-3"><i class="bi bi-lock-fill"></i></div>
            <span class="pv-eyebrow">PREMIUM FEATURE</span>
            <h1 class="h2 mt-3">Code Visualizations Lab</h1>
            <p class="pv-muted mx-auto" style="max-width:560px">This interactive algorithm visualization lab is included with the Premium plan (₹499 for 12 months / 360 days).</p>
            <p class="pv-muted small">Pro and Starter students can continue using their included learning sections and mock tests.</p>
            <a class="btn btn-mint mt-2" href="subscriptions.html">View Premium plan</a>
            <a class="btn btn-outline-mint mt-2 ms-2" href="student-dashboard.html">Back to dashboard</a>
          </section>`;
        return;
      }
      renderCodeVisualizations(root);
    });
  </script>
</body>
</html>
