<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon"
href="./favicon.svg">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="maintenance.js"></script>
<title>Learning - Pyvanta Learning Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" rel="stylesheet" />
<link href="style.css" rel="stylesheet" />
<link href="code-visualizations.css" rel="stylesheet" />

  <link href="pyvanta-theme.css" rel="stylesheet" />

<style>
.concept-viz-card{background:rgba(20,25,40,.72);border:1px solid rgba(139,92,246,.35);border-radius:16px;padding:18px;min-width:0}
.concept-viz-card h5{font-size:1.05rem;font-weight:700;margin:0 0 8px;color:#22d3ee}
.concept-chart-wrap{width:100%;overflow-x:auto}
.concept-chart-svg{width:100%;min-width:360px;height:auto;display:block}
.concept-chart-svg text{fill:#aab5c8;font-size:11px}
.concept-pie-layout{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.concept-pie{width:170px;height:170px;border-radius:50%;flex:0 0 170px}
.concept-legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.concept-flow{display:flex;flex-direction:column;align-items:center;gap:7px}
.concept-flow-step{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid rgba(34,211,238,.35);border-radius:12px;width:min(100%,520px);background:rgba(34,211,238,.06)}
.concept-flow-step span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#8b5cf6;color:white;font-weight:700;flex:0 0 26px}
.concept-flow-arrow{color:#22d3ee;font-size:20px;line-height:1}
</style>

</head>
<body class="learning-body">

<nav class="navbar navbar-dark bg-brand mb-4">
  <div class="container-fluid">
    <a href="student-dashboard.html" class="navbar-brand"><i class="bi bi-arrow-left me-2"></i>Back to Dashboard</a>
    <button class="btn btn-outline-light btn-sm" data-logout="true"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
  </div>
</nav>

<div class="container pb-5" id="pageBody">
  <div class="text-muted">Loading level...</div>
</div>

<template id="tmplLoaded">
  <div class="learning-hero mb-4">
    <h4 class="fw-bold mb-1" id="levelTitle"></h4>
    <p class="mb-0" id="levelDesc"></p>
  </div>

  <div class="row g-3">
    <div class="col-lg-3">
      <div class="learning-card-glass p-2 learning-path-card">
        <div class="fw-semibold small mb-2 text-muted px-2 pt-1">LEARNING PATH</div>
        <div id="learningNav" class="d-flex flex-column gap-1"></div>
      </div>
    </div>
    <div class="col-lg-9">
      <div class="learning-card-glass p-3" id="learningContent"></div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
<script type="module" src="learning-page.js"></script>
</body>
</html>
